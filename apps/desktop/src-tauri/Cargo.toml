[package]
name = "grillo-project-hub"
version = "0.1.0"
description = "Grillo Project Hub desktop shell"
authors = ["Grillo Project Hub contributors"]
edition = "2021"

[lib]
name = "grillo_project_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
