<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f8a55" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem("gph.appearance.v2") || "null");
          const legacy = localStorage.getItem("gph.theme");
          const mode = stored?.mode || legacy || "system";
          const resolved = mode === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {}
      })();
    </script>
    <title>Grillo Project Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
